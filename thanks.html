<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дякуємо за заявку! | ClickYourGuide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .thanks-card {
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .icon-box {
            width: 80px;
            height: 80px;
            background: rgba(14, 165, 233, 0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .icon-box svg {
            width: 42px;
            height: 42px;
            fill: none;
            stroke: #0ea5e9;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .btn-home {
            display: inline-block;
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 600;
            font-size: 16px;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-home:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="thanks-card">
        <div class="icon-box">
            <svg viewBox="0 0 24 24">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
        </div>
        
        <h1>Дякуємо за заявку!</h1>
        <p>Ми вже отримали ваші дані та підбираємо найкращі варіанти яхт. Менеджер зв'яжеться з вами у WhatsApp або Telegram протягом 15 хвилин.</p>
        
        <a href="index.html" class="btn-home">Повернутися на головну</a>
    </div>

</body>
</html>
